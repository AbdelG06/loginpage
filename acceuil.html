<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./acceuil.css">
    <title>Page d'Accueil</title>
</head>
<body>
     <div class="message-box">
        <h1 style="color: #28a745;">Connexion réussie !</h1>
        <h2 id="welcome-msg">Bienvenue</h2>
        
        <div style="margin: 20px 0;">
            <iframe width="560" height="315" src="https://www.youtube.com/embed/aL6qL5TlZR4?si=4P9urWTIfhOEv4xK" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>

        <button onclick="seDeconnecter()">Se déconnecter</button>
     </div>

     <script>
         const currentUser = JSON.parse(localStorage.getItem("currentUser"));
         const msgElement = document.getElementById("welcome-msg");

         if(currentUser && currentUser.nom) {
             msgElement.innerText = "Bienvenue, " + currentUser.nom + " !";
         } else {
             // Si personne n'est connecté, on renvoie vers l'inscription/login
             window.location.href = "index.html"; 
         }

         function seDeconnecter() {
             localStorage.removeItem("currentUser");
             window.location.href = "index.html";
         }
     </script>
</body>
</html>
